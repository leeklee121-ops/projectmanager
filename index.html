<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모아 | 프로젝트 자료 관리</title>
<style>
:root {
  --bg:#f7f8fb; --surface:#fff; --card:#f1f3f7; --line:#e2e6ed;
  --text:#273142; --muted:#788397; --blue:#7d9bb8; --blue-dark:#557794;
  --pink:#d99daf; --pink-light:#f8eaf0; --blue-light:#eaf1f7;
  --danger:#b94b62; --shadow:0 8px 24px rgba(35,48,68,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1240px;margin:0 auto;padding:28px 24px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--blue-light);color:var(--blue-dark);font-size:22px;font-weight:800}
h1{font-size:25px;margin:0;letter-spacing:-.8px}
.subtitle{margin:3px 0 0;color:var(--muted);font-size:13px}
.header-note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--muted)}
.stat-value{font-size:27px;font-weight:750;margin-top:4px;letter-spacing:-.5px}
.stat-value small{font-size:13px;font-weight:500;color:var(--muted)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:19px 21px 15px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16px;margin:0}
.panel-head p{font-size:12px;color:var(--muted);margin:4px 0 0}
.panel-body{padding:20px}
.field{margin-bottom:15px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#515d70}
input[type=text],input[type=url],textarea,select{width:100%;border:1px solid #dce2ea;border-radius:10px;background:#fff;padding:11px 12px;color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:88px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(125,155,184,.16)}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue-dark);color:white}
.btn-soft{background:var(--blue-light);color:var(--blue-dark)}
.btn-pink{background:var(--pink-light);color:#a65d76}
.btn-ghost{background:#f4f5f8;color:#5e697b}
.btn-danger{background:#fff0f2;color:var(--danger)}
.btn-full{width:100%}
.workspace{min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.toolbar h2{font-size:19px;margin:0}
.toolbar p{font-size:12px;color:var(--muted);margin:3px 0 0}
.search-filter{display:flex;gap:8px;flex-wrap:wrap}
.search-filter input{width:210px}
.search-filter select{width:auto;min-width:120px}
.project-list{display:grid;gap:13px}
.project-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.project-card.completed{opacity:.83}
.project-main{padding:17px 19px 15px}
.project-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.project-title-wrap{min-width:0}
.project-title{font-size:16px;font-weight:750;overflow-wrap:anywhere;margin:0}
.project-desc{font-size:12px;color:var(--muted);margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-active{background:var(--blue-light);color:var(--blue-dark)}
.badge-done{background:var(--pink-light);color:#a65d76}
.project-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:11px;color:var(--muted)}
.project-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}
.project-actions .btn{padding:7px 10px;font-size:11px}
.materials{border-top:1px solid var(--line);background:#fbfcfe;padding:14px 19px 17px}
.material-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.material-head h3{font-size:12px;margin:0}
.material-count{font-size:11px;color:var(--muted)}
.material-list{display:grid;gap:8px}
.material{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid #e8ebf1;border-radius:11px;background:#fff;min-width:0}
.file-icon{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border-radius:10px;background:var(--blue-light);color:var(--blue-dark);font-size:16px}
.file-icon.link{background:var(--pink-light);color:#a65d76}
.material-info{min-width:0;flex:1}
.material-name{display:block;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.material-note{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.material-open{font-size:11px;color:var(--blue-dark);text-decoration:none;font-weight:700;white-space:nowrap}
.material-open:hover{text-decoration:underline}
.material-remove{border:0;background:transparent;color:#9aa3b1;font-size:18px;padding:3px 5px}
.material-remove:hover{color:var(--danger)}
.empty{padding:28px 15px;text-align:center;border:1px dashed #d9dfe8;border-radius:12px;color:var(--muted);font-size:12px;background:#fcfcfd}
.empty strong{display:block;color:#586477;font-size:13px;margin-bottom:4px}
.empty-icon{font-size:25px;margin-bottom:8px}
.inline-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.inline-form .field{margin:0}
.inline-form .wide{grid-column:1/-1}
.inline-form .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:7px}
.inline-form[hidden]{display:none}
.file-input{display:block;width:100%;padding:9px;border:1px dashed #cfd7e2;border-radius:10px;font-size:12px;background:#fbfcfe}
.notice{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.6}
footer{margin-top:22px;text-align:center;font-size:11px;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:#273142;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px #1720332b;z-index:20;max-width:min(360px,calc(100vw - 32px))}
.toast.error{background:#9f3d52}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{order:2}.workspace{order:1}.app{padding:20px 16px 38px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:23px}}
@media(max-width:560px){header{align-items:flex-start}.header-note{display:none}h1{font-size:22px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.toolbar{align-items:flex-start}.search-filter{width:100%}.search-filter input{width:100%;flex:1}.search-filter select{flex:1;min-width:0}.project-main{padding:15px}.materials{padding:13px 15px}.project-top{align-items:flex-start}.project-actions .btn{flex:1}.inline-form{grid-template-columns:1fr}.inline-form .wide,.inline-form .form-actions{grid-column:1}.material{gap:8px}.material-open{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">모</div>
      <div><h1>모아 <span style="font-weight:400;color:#7d899b">/ 프로젝트 자료 관리</span></h1><p class="subtitle">프로젝트와 자료를 한곳에서 정리하세요.</p></div>
    </div>
    <div class="header-note">개인용 · 브라우저에서 실행</div>
  </header>

  <section class="stats" aria-label="프로젝트 통계">
    <div class="stat"><div class="stat-label">전체 프로젝트</div><div class="stat-value" id="totalCount">0 <small>개</small></div></div>
    <div class="stat"><div class="stat-label">진행 중</div><div class="stat-value" id="activeCount">0 <small>개</small></div></div>
    <div class="stat"><div class="stat-label">완료</div><div class="stat-value" id="doneCount">0 <small>개</small></div></div>
  </section>

  <main class="layout">
    <aside class="panel sidebar">
      <div class="panel-head"><h2>＋ 새 프로젝트 등록</h2><p>프로젝트의 기본 정보를 입력하세요.</p></div>
      <div class="panel-body">
        <form id="projectForm" novalidate>
          <div class="field"><label for="projectName">프로젝트명 <span style="color:#c46c84">*</span></label><input id="projectName" type="text" maxlength="100" placeholder="예: 졸업 연구 프로젝트" required></div>
          <div class="field"><label for="projectDesc">프로젝트 설명</label><textarea id="projectDesc" maxlength="1000" placeholder="목표, 일정, 담당자 등 추가 정보를 입력하세요."></textarea></div>
          <button class="btn btn-primary btn-full" type="submit">프로젝트 등록하기</button>
        </form>
        <p class="notice">※ 이 데모는 데이터를 브라우저의 이 페이지에 보관합니다. 브라우저 저장소를 사용하지 않으므로 새로고침하거나 페이지를 닫으면 등록 정보가 초기화됩니다.</p>
      </div>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <div><h2>내 프로젝트</h2><p id="listSummary">프로젝트와 관련 자료를 관리하세요.</p></div>
        <div class="search-filter">
          <input id="searchInput" type="text" placeholder="프로젝트 검색..." aria-label="프로젝트 검색">
          <select id="statusFilter" aria-label="상태 필터"><option value="all">전체 상태</option><option value="active">진행 중</option><option value="done">완료</option></select>
        </div>
      </div>
      <div id="projectList" class="project-list"></div>
    </section>
  </main>
  <footer>모아 · 프로젝트와 자료를 깔끔하게 정리하는 공간</footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  'use strict';
  const projects = [];
  let nextProjectId = 1;
  let nextMaterialId = 1;
  let toastTimer;

  const $ = id => document.getElementById(id);
  const projectList = $('projectList');

  function notify(message, isError = false) {
    const toast = $('toast');
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[char]);
  }

  function formatDate(date) {
    return new Intl.DateTimeFormat('ko-KR', {year:'numeric', month:'2-digit', day:'2-digit'}).format(date);
  }

  function safeURL(raw) {
    try {
      const url = new URL(raw.trim());
      if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
    } catch (_) {}
    return null;
  }

  function updateStats() {
    $('totalCount').innerHTML = `${projects.length} <small>개</small>`;
    $('activeCount').innerHTML = `${projects.filter(p => !p.completed).length} <small>개</small>`;
    $('doneCount').innerHTML = `${projects.filter(p => p.completed).length} <small>개</small>`;
  }

  function render() {
    updateStats();
    const search = $('searchInput').value.trim().toLocaleLowerCase();
    const status = $('statusFilter').value;
    const filtered = projects.filter(p => {
      const matchesSearch = (p.name + ' ' + p.description).toLocaleLowerCase().includes(search);
      const matchesStatus = status === 'all' || (status === 'done' ? p.completed : !p.completed);
      return matchesSearch && matchesStatus;
    });

    $('listSummary').textContent = `전체 ${projects.length}개 · 표시 ${filtered.length}개`;
    if (filtered.length === 0) {
      projectList.innerHTML = `<div class="empty"><div class="empty-icon">▤</div><strong>${projects.length ? '검색 결과가 없습니다.' : '아직 등록된 프로젝트가 없습니다.'}</strong>${projects.length ? '검색어 또는 상태 필터를 바꿔보세요.' : '왼쪽에서 첫 프로젝트를 등록해 보세요.'}</div>`;
      return;
    }

    projectList.innerHTML = filtered.map(p => `
      <article class="project-card ${p.completed ? 'completed' : ''}" data-project-id="${p.id}">
        <div class="project-main">
          <div class="project-top">
            <div class="project-title-wrap">
              <h3 class="project-title">${escapeHTML(p.name)}</h3>
              ${p.description ? `<p class="project-desc">${escapeHTML(p.description)}</p>` : ''}
            </div>
            <span class="badge ${p.completed ? 'badge-done' : 'badge-active'}">${p.completed ? '✓ 완료' : '● 진행 중'}</span>
          </div>
          <div class="project-meta"><span>등록일 ${formatDate(p.createdAt)}</span><span>자료 ${p.materials.length}개</span></div>
          <div class="project-actions">
            <button type="button" class="btn btn-soft" data-action="add-material" data-id="${p.id}">＋ 자료 등록</button>
            <button type="button" class="btn ${p.completed ? 'btn-pink' : 'btn-ghost'}" data-action="toggle" data-id="${p.id}">${p.completed ? '↶ 진행 중으로 되돌리기' : '✓ 완료 처리'}</button>
            <button type="button" class="btn btn-ghost" data-action="edit" data-id="${p.id}">정보 수정</button>
            <button type="button" class="btn btn-danger" data-action="delete" data-id="${p.id}">삭제</button>
          </div>
        </div>
        <div class="materials">
          <div class="material-head"><h3>📎 프로젝트 자료</h3><span class="material-count">${p.materials.length}개 등록됨</span></div>
          <form class="inline-form" data-material-form="${p.id}" hidden>
            <div class="field"><label>자료 유형</label><select name="type"><option value="link">웹 링크</option><option value="file">파일</option></select></div>
            <div class="field"><label>자료명 <span style="color:#c46c84">*</span></label><input name="title" type="text" maxlength="120" placeholder="예: 참고 논문 / 발표 자료" required></div>
            <div class="field wide link-field"><label>웹 주소</label><input name="url" type="url" placeholder="https://example.com"></div>
            <div class="field wide file-field" hidden><label>파일 선택</label><input class="file-input" name="file" type="file"><div class="hint">선택한 파일은 이 페이지에서 열 수 있도록 임시로 연결됩니다.</div></div>
            <div class="field wide"><label>자료 설명 (선택)</label><input name="note" type="text" maxlength="300" placeholder="이 자료를 사용하는 목적"></div>
            <div class="form-actions"><button class="btn btn-ghost" type="button" data-action="cancel-material" data-id="${p.id}">취소</button><button class="btn btn-primary" type="submit">자료 등록</button></div>
          </form>
          <div class="material-list">
            ${p.materials.length ? p.materials.map(m => `
              <div class="material">
                <div class="file-icon ${m.type === 'link' ? 'link' : ''}">${m.type === 'link' ? '↗' : '▧'}</div>
                <div class="material-info"><span class="material-name">${escapeHTML(m.title)}</span>${m.note ? `<div class="material-note">${escapeHTML(m.note)}</div>` : `<div class="material-note">${m.type === 'link' ? escapeHTML(m.url) : escapeHTML(m.fileName || '첨부 파일')}</div>`}</div>
                ${m.type === 'link' ? `<a class="material-open" href="${escapeHTML(m.url)}" target="_blank" rel="noopener noreferrer">열기 ↗</a>` : `<a class="material-open" href="${m.objectURL}" download="${escapeHTML(m.fileName)}">열기/저장 ↓</a>`}
                <button type="button" class="material-remove" title="자료 삭제" aria-label="${escapeHTML(m.title)} 자료 삭제" data-action="remove-material" data-id="${p.id}" data-material-id="${m.id}">×</button>
              </div>
            `).join('') : `<div class="empty"><strong>등록된 자료가 없습니다.</strong>링크나 파일을 추가하면 여기에 표시됩니다.</div>`}
          </div>
        </div>
      </article>
    `).join('');
  }

  $('projectForm').addEventListener('submit', event => {
    event.preventDefault();
    const name = $('projectName').value.trim();
    const description = $('projectDesc').value.trim();
    if (!name) {
      notify('프로젝트명을 입력해 주세요.', true);
      $('projectName').focus();
      return;
    }
    projects.unshift({id: nextProjectId++, name, description, completed:false, createdAt:new Date(), materials:[]});
    $('projectForm').reset();
    $('searchInput').value = '';
    $('statusFilter').value = 'all';
    render();
    notify('프로젝트가 등록되었습니다.');
  });

  $('searchInput').addEventListener('input', render);
  $('statusFilter').addEventListener('change', render);

  projectList.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const id = Number(button.dataset.id);
    const project = projects.find(p => p.id === id);
    if (!project) return;
    const action = button.dataset.action;

    if (action === 'toggle') {
      project.completed = !project.completed;
      render();
      notify(project.completed ? '프로젝트를 완료 상태로 변경했습니다.' : '프로젝트를 진행 중 상태로 되돌렸습니다.');
    } else if (action === 'add-material') {
      const form = projectList.querySelector(`[data-material-form="${id}"]`);
      form.hidden = !form.hidden;
      if (!form.hidden) {
        form.querySelector('[name="title"]').focus();
        form.scrollIntoView({behavior:'smooth', block:'nearest'});
      }
    } else if (action === 'cancel-material') {
      const form = projectList.querySelector(`[data-material-form="${id}"]`);
      form.reset();
      form.hidden = true;
      form.querySelector('.link-field').hidden = false;
      form.querySelector('.file-field').hidden = true;
    } else if (action === 'remove-material') {
      const materialId = Number(button.dataset.materialId);
      const index = project.materials.findIndex(m => m.id === materialId);
      if (index >= 0) {
        const material = project.materials[index];
        if (material.objectURL) URL.revokeObjectURL(material.objectURL);
        project.materials.splice(index, 1);
        render();
        notify('자료를 목록에서 삭제했습니다.');
      }
    } else if (action === 'delete') {
      if (!confirm(`'${project.name}' 프로젝트를 삭제할까요?\n등록된 자료 목록도 함께 삭제됩니다.`)) return;
      project.materials.forEach(m => { if (m.objectURL) URL.revokeObjectURL(m.objectURL); });
      projects.splice(projects.findIndex(p => p.id === id), 1);
      render();
      notify('프로젝트가 삭제되었습니다.');
    } else if (action === 'edit') {
      const newName = prompt('프로젝트명을 수정하세요.', project.name);
      if (newName === null) return;
      if (!newName.trim()) {
        notify('프로젝트명은 비워둘 수 없습니다.', true);
        return;
      }
      const newDesc = prompt('프로젝트 설명을 수정하세요.', project.description);
      if (newDesc === null) return;
      project.name = newName.trim().slice(0, 100);
      project.description = newDesc.trim().slice(0, 1000);
      render();
      notify('프로젝트 정보가 수정되었습니다.');
    }
  });

  projectList.addEventListener('change', event => {
    const form = event.target.closest('form[data-material-form]');
    if (!form || event.target.name !== 'type') return;
    const isFile = event.target.value === 'file';
    form.querySelector('.link-field').hidden = isFile;
    form.querySelector('.file-field').hidden = !isFile;
  });

  projectList.addEventListener('submit', event => {
    const form = event.target.closest('form[data-material-form]');
    if (!form) return;
    event.preventDefault();
    const id = Number(form.dataset.materialForm);
    const project = projects.find(p => p.id === id);
    if (!project) return;
    const type = form.elements.type.value;
    const title = form.elements.title.value.trim();
    const note = form.elements.note.value.trim();
    if (!title) {
      notify('자료명을 입력해 주세요.', true);
      form.elements.title.focus();
      return;
    }

    let material;
    if (type === 'link') {
      const rawURL = form.elements.url.value.trim();
      const url = safeURL(rawURL);
      if (!url) {
        notify('http:// 또는 https://로 시작하는 올바른 웹 주소를 입력해 주세요.', true);
        form.elements.url.focus();
        return;
      }
      material = {id:nextMaterialId++, type, title, note, url};
    } else {
      const file = form.elements.file.files[0];
      if (!file) {
        notify('등록할 파일을 선택해 주세요.', true);
        form.elements.file.focus();
        return;
      }
      const objectURL = URL.createObjectURL(file);
      material = {id:nextMaterialId++, type, title, note, fileName:file.name, objectURL};
    }
    project.materials.unshift(material);
    render();
    notify('자료가 해당 프로젝트에 등록되었습니다.');
  });

  render();
})();
</script>
</body>
</html>
